
# ScanGuard v1.3.1
# Custom ByteTrack Configuration

tracker_type: bytetrack

# Detection association thresholds
track_high_thresh: 0.20
track_low_thresh: 0.10
new_track_thresh: 0.20

# Keep lost tracks for up to 60 frames
track_buffer: 60

# Matching configuration
match_thresh: 0.85
fuse_score: True
