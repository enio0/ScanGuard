
# ScanGuard Custom ByteTrack Configuration

tracker_type: bytetrack

# Detection matching thresholds
track_high_thresh: 0.25
track_low_thresh: 0.10
new_track_thresh: 0.25

# Keep temporarily lost objects for more frames
track_buffer: 60

# More lenient matching between detections
match_thresh: 0.85

# Combine detection confidence with matching
fuse_score: True
